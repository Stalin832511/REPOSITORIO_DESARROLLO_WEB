<h2>👥 Clientes</h2>

<!-- ✅ BOTÓN PDF -->
<a href="/clientes/pdf" class="btn btn-danger mb-3">
    📄 Descargar PDF
</a>

<br><br>

<a href="/clientes/crear" class="btn btn-success mb-3">➕ Nuevo Cliente</a>

<table border="1" class="table table-bordered table-striped">
<tr>
    <th>Cédula</th>
    <th>Nombre</th>
    <th>Dirección</th> <!-- ✅ NUEVO -->
    <th>Teléfono</th>
    <th>Correo</th>
    <th>Acciones</th>
</tr>

{% for c in clientes %}
<tr>
    <td>{{ c[0] }}</td> <!-- Cedula -->
    <td>{{ c[1] }}</td> <!-- Nombre -->
    <td>{{ c[2] }}</td> <!-- Dirección ✅ -->
    <td>{{ c[3] }}</td> <!-- Teléfono -->
    <td>{{ c[4] }}</td> <!-- Correo -->
    <td>
        <a href="/clientes/editar/{{ c[0] }}" class="btn btn-warning btn-sm">✏️</a>
        <a href="/clientes/eliminar/{{ c[0] }}" class="btn btn-danger btn-sm">❌</a>
    </td>
</tr>
{% endfor %}
</table>
