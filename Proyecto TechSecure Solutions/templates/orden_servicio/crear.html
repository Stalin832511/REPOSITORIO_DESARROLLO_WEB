<!DOCTYPE html>
<html>
<head>
    <title>Crear Orden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h2>Nueva Orden de Servicio</h2>

    <form method="POST">
        <input type="date" name="fecha_solicitud" class="form-control mb-2" required>
        <input type="date" name="fecha_programada" class="form-control mb-2" required>
        <input type="text" name="estado" placeholder="Estado" class="form-control mb-2" required>
        <input type="text" name="observaciones" placeholder="Observaciones" class="form-control mb-2">
        <input type="text" name="cedula" placeholder="Cédula Cliente" class="form-control mb-2" required>
        <input type="number" name="id_servicio" placeholder="ID Servicio" class="form-control mb-2" required>

        <button class="btn btn-success">Guardar</button>
    </form>
</div>

</body>
</html>
