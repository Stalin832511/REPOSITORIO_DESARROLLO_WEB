<!DOCTYPE html>
<html>
<head>
    <title>Órdenes de Servicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2 class="mb-4">Lista de Órdenes de Servicio</h2>

    <!-- BOTONES -->
    <a href="/crear" class="btn btn-primary mb-3">Nueva Orden</a>
    <a href="/reporte" class="btn btn-success mb-3">Generar PDF</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Fecha Solicitud</th>
                <th>Fecha Programada</th>
                <th>Estado</th>
                <th>Cliente</th>
                <th>Servicio</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            {% for o in ordenes %}
            <tr>
                <td>{{ o[0] }}</td>
                <td>{{ o[1] }}</td>
                <td>{{ o[2] }}</td>
                <td>{{ o[3] }}</td>
                <td>{{ o[5] }}</td>
                <td>{{ o[6] }}</td>
                <td>
                    <!-- EDITAR -->
                    <a href="/editar/{{ o[0] }}" class="btn btn-warning btn-sm">Editar</a>

                    <!-- ELIMINAR -->
                    <a href="/eliminar/{{ o[0] }}" 
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Seguro que deseas eliminar esta orden?')">
                       Eliminar
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>
