{% extends 'base.html' %}

{% block content %}

<h3 class="mb-3">📦 Gestión de Órdenes</h3>

<input type="text" id="buscador" class="form-control mb-3" placeholder="🔍 Buscar orden...">

<table class="table table-hover shadow">
    <tr class="table-dark">
        <th>ID</th>
        <th>Fecha</th>
        <th>Estado</th>
        <th>Cliente</th>
        <th>Servicio</th>
    </tr>

    {% for o in ordenes %}
    <tr>
        <td>{{ o[0] }}</td>
        <td>{{ o[1] }}</td>
        <td>
            <span class="badge bg-info">{{ o[2] }}</span>
        </td>
        <td>{{ o[3] }}</td>
        <td>{{ o[4] }}</td>
    </tr>
    {% endfor %}
</table>

<script>
document.getElementById("buscador").addEventListener("keyup", function() {
    let filtro = this.value.toLowerCase();
    let filas = document.querySelectorAll("table tr");

    filas.forEach((fila, i) => {
        if(i === 0) return;
        fila.style.display = fila.textContent.toLowerCase().includes(filtro) ? "" : "none";
    });
});
</script>

{% endblock %}
