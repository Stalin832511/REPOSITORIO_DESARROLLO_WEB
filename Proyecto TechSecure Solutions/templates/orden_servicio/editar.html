<!DOCTYPE html>
<html>
<head>
    <title>Editar Orden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h2>Editar Orden de Servicio</h2>

    <form method="POST">
        <input type="date" name="fecha_solicitud" value="{{ orden[1] }}" class="form-control mb-2">
        <input type="date" name="fecha_programada" value="{{ orden[2] }}" class="form-control mb-2">
        <input type="text" name="estado" value="{{ orden[3] }}" class="form-control mb-2">
        <input type="text" name="observaciones" value="{{ orden[4] }}" class="form-control mb-2">
        <input type="text" name="cedula" value="{{ orden[5] }}" class="form-control mb-2">
        <input type="number" name="id_servicio" value="{{ orden[6] }}" class="form-control mb-2">

        <button class="btn btn-warning">Actualizar</button>
    </form>
</div>

</body>
</html>
